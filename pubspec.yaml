name: droplet_matter_lab
description: "Droplet Matter Lab : laboratoire de la matière visuelle Prismatic Aether."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/scene.jpg

  fonts:
    - family: Commissioner
      fonts:
        - asset: assets/fonts/Commissioner-Variable.ttf
    - family: MartianMono
      fonts:
        - asset: assets/fonts/MartianMono-Variable.ttf

  shaders:
    - shaders/e01_prismatic_surface.frag
    - shaders/e02_morphing_object.frag
    - shaders/e03_aether_atmosphere.frag
    - shaders/e04_prismatic_morph.frag
    - shaders/e05_interactive_matter.frag
    - shaders/e06_signature.frag
